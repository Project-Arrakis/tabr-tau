<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabr Tau</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/motion-boot.js"></script>
<link rel="stylesheet" href="/design/tokens-fremen.css">
<link rel="stylesheet" href="/design/components-fremen.css">
<link rel="stylesheet" href="/design/components.css">
<link rel="stylesheet" href="/design/motion.css">
<link rel="stylesheet" href="/app.css">
<script src="/look-boot.js"></script>
</head>
<body>
<header class="d-bar">
  <svg class="mark" viewBox="0 0 24 24" role="presentation"><path d="M16.5 4.8a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 1 0 0-6.4zM1.5 18.5c3.6-5.4 7.4-5.6 10.4-2.4 2.4 2.5 5.8 2.7 10.6-1.6v7H1.5z"/></svg>
  <h1>Tabr Tau</h1><span class="warn hide" id="notlive"></span><span class="path" id="path"></span>
  <span id="pending" class="mut d-pill"></span>
  <span class="x-saved" id="savedmark" hidden><svg class="d-fx" viewBox="0 0 24 24" aria-hidden="true"><path class="chk" d="M8.6 13.4l2.7 2.7 4.5-5.1"/></svg>Written</span>
  <label class="mut" title="When the game saves and no changes are queued, reload the file and redraw this page"><input type="checkbox" id="autorefresh" class="d-toggle" checked> Auto-refresh</label>
  <button class="b sec d-btn sm" id="btnDiscard" hidden title="Drop the changes that are waiting for the game to close">Discard queue</button>
  <span class="theme-host" id="theme-host"></span>
</header>
<div id="gamewarn" class="hide"></div>
<div id="launchpass" class="hide"></div>
<div id="rowarn" class="hide"></div>
<nav id="nav" class="d-nav"></nav>
<main id="main"><p class="mut" id="loading" role="status">Loading the save...</p></main>
<div id="ask" class="hide"></div>
<div id="toast" class="d-toasts" aria-live="polite"></div>
<div id="sr" class="sr" role="status" aria-live="polite"></div>
<script src="/html.js"></script>
<script src="/livemap.js"></script>
<script src="/theme-menu.js"></script>
<script src="/app.js"></script>
</body>
</html>
