name: Bug
description: Something does not work. Do not attach saves, snapshots, Game.ini or logs; they contain account IDs.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: {required: true}
  - type: dropdown
    id: reported
    attributes:
      label: How bad is it, as you report it?
      description: The priority you give this bug. The team schedules it separately and never below what you say here without your OK.
      options:
        - rp1-critical (this can't happen, ever; it stops me; loses data or is unsafe)
        - rp2-high (clearly wrong and in my way, but I can still work)
        - rp3-normal (wrong, but I can work around it)
        - rp4-low (cosmetic or minor)
        - rp-unset (I have not decided; please ask me)
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: tabr-tau version or commit
  - type: input
    id: game
    attributes:
      label: Game build / patch (from applied_patches, if known)
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: The game was fully closed when I saved
        - label: I kept a backup and can restore it
        - label: I removed account IDs from anything I pasted here
