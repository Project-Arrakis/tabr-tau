name: CI

# Least privilege: every job gets read-only contents. Actions are pinned to full commit SHAs
# (Dependabot keeps them current). Tool versions are pinned. See docs/audit findings F-09, F-11.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    name: go
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: cross-compile for Windows (the native window code only builds there)
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-H=windowsgui -s -w" -o /dev/null ./cmd/tabr-tau
          GOOS=windows GOARCH=386 CGO_ENABLED=0 go vet ./internal/gui/ ./cmd/...
      - name: go test (race, coverage)
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  windows:
    name: windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Windows-only code (process check, native window, file handling) is otherwise only cross-compiled, never run (#85).
      - name: go vet
        run: go vet ./...
      - name: go test
        # The limit is per test binary and shorter than the job's: a test that hangs ends the run with every goroutine's stack and the
        # name of the running test, long before the job could be cancelled without a word (#437). The suite takes a few minutes here: its
        # test saves are built from a template and the tests do not wait for the disk except where a test is about that (#89, #437),
        # so 12 minutes is a generous multiple, not an expected time. If a slow runner ever needs more, raise THIS number first (a slow runner once needed 20, #269), and the job's
        # timeout-minutes above it with it. The bounded-work tests (internal/ops/bounded_work_test.go) stop waiting after a minute of their own, so they never wait for this limit.
        # Keep this step in PowerShell, not bash: under Git Bash on the runner the tests that hold the save open exclusively (a scanner
        # simulation, readback_unverified_windows_test.go) are not held, so they fail. Tee-Object keeps the log for the next step and
        # the step still fails with go's exit code ($LASTEXITCODE is go's, not Tee-Object's).
        run: go test -count=1 -timeout 12m -v ./... | Tee-Object -FilePath test.log
      - name: slowest tests
        if: always()
        shell: bash
        run: bash scripts/slowest-tests.sh test.log 10

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: govulncheck (Windows build)
        run: |
          # install the scanner for the runner, then point it at the Windows build (GOOS applies to the target only)
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          GOOS=windows "$RUNNER_TEMP/bin/govulncheck" ./...

  powershell:
    name: powershell
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PSScriptAnalyzer (Error and Warning fail the build)
        shell: pwsh
        run: |
          # PSGallery is sometimes unreachable for a minute: try again before failing
          foreach ($try in 1..3) {
            try { Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -Repository PSGallery -ErrorAction Stop; break }
            catch { if ($try -eq 3) { throw }; Write-Host "PSGallery try $try failed: $($_.Exception.Message)"; Start-Sleep -Seconds (15 * $try) }
          }
          # Write-Host is intentional: these are interactive operator scripts, not pipeline cmdlets.
          $r = Invoke-ScriptAnalyzer -Path tools -Recurse -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost
          $r | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap | Out-String -Width 200 | Write-Host
          # Parse check: catches errors like an interpolated "$var:" that PSScriptAnalyzer may not flag.
          $bad = 0
          Get-ChildItem tools -Filter *.ps1 -Recurse | ForEach-Object {
            $t = $null; $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$t, [ref]$e) | Out-Null
            if ($e.Count) { $e | ForEach-Object { Write-Host "PARSE ERROR $($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }; $bad++ }
          }
          if ($r.Count -gt 0 -or $bad -gt 0) { exit 1 }

  ui:
    name: ui
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2' # an exact version: Dependabot cannot see it, bump by hand; the floor is web-tests' lockfile engines
      - name: Generate hostile UI fixtures from the real handlers over a real-schema save
        run: UI_FIXTURES_DIR="$PWD/web-tests/fixtures" go test ./internal/web -run TestDumpUIFixtures -count=1 -v
      - name: Browser-engine tests (jsdom pinned by lockfile, install scripts disabled)
        working-directory: web-tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          UI_FIXTURES_DIR="$PWD/fixtures" node --test --test-timeout=120000

  python-tools:
    name: python-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Syntax check and --help smoke test (Python >= 3.11 required by the tools)
        run: |
          python -m py_compile tools/snapdiff.py tools/snapsummary.py tools/featureinv.py
          python tools/snapdiff.py --help > /dev/null
          python tools/snapsummary.py --help > /dev/null

  commit-messages:
    name: commit-messages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: No AI co-author trailers or attribution lines (operator policy, F-12)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/check-commit-messages.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck (-S warning, as Requirement 9)
        run: shellcheck -S warning scripts/*.sh

  security-scan:
    name: security-scan
    uses: Project-Arrakis/.github/.github/workflows/reusable-security-scan-v2.yml@2b8bd347453e032e6085cd42fafcdf659245a7dd # v2 of the shared scan pinned at the commit that carries the hash-locked semgrep requirements and the rule snapshot (Project-Arrakis/.github#11 and #12, 2026-10-23); tools-ref below makes the scan install and run from those files
    with:
      tools-ref: 2b8bd347453e032e6085cd42fafcdf659245a7dd
    permissions:
      contents: read
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
