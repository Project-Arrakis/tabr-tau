name: Public text

# The public-text rule over the text of a pull request: its title, body and branch name, and its commit messages (audit 2026-11-14 F1, #653;
# #701). The tracked files are covered by internal/hygiene in the CI workflow. The text of issues, comments and reviews is read by the
# separate workflow public-text-discussion.yml, on purpose: two jobs with one check name on one head commit make the newest result decide,
# so a later review run that checks less could replace a failed run of this job (#701). This workflow runs on the pull_request event only, so
# nothing else can ever report a check named "public-text" on a pull request's head commit, not even as a skipped job. The check reads the
# event payload from the runner's file, never from an expression in a command, so text written by a stranger is data and never code. The job
# runs on the plain pull_request event (not the variant that runs with a write token over a fork's text): it has a read-only token and no secret
# it could leak to a fork's code. It runs again when the text is edited. Add the check named "public-text" to the required checks of the
# branch rule for main, so a pull request cannot merge while its title, body, branch name or commit messages fail it.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: public-text-pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  public-text:
    name: public-text
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Title, body and branch name carry nothing the public-text rule forbids (and a pull request carries no AI attribution line)
        # GITHUB_EVENT_NAME and GITHUB_EVENT_PATH are set by the runner. The extra digest list is an optional repository secret (empty for a fork's pull request).
        env:
          PUBLIC_TEXT_EXTRA_DIGESTS: ${{ secrets.PUBLIC_TEXT_EXTRA_DIGESTS }}
        run: go run ./cmd/publictextcheck
      - name: The commit messages of the pull request carry nothing the rule forbids
        env:
          PUBLIC_TEXT_EXTRA_DIGESTS: ${{ secrets.PUBLIC_TEXT_EXTRA_DIGESTS }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --format='%H%x00%B%x01' "${BASE_SHA}..${HEAD_SHA}" > "${RUNNER_TEMP}/commits.log"
          go run ./cmd/publictextcheck -commits "${RUNNER_TEMP}/commits.log"
