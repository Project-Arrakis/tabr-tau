<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- Tabr design grain: a faint sand noise, drawn for this module, tiled by the Awakening look (the tile is 180 px and repeats without a seam). -->
  <filter id="n" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .7  0 0 0 0 .55  0 0 0 0 .38  0 0 0 .2 -.075"/>
  </filter>
  <rect width="180" height="180" filter="url(#n)"/>
</svg>
